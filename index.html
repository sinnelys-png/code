<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROYAL CROSSBREED UNIVERSITY</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
    <div class="header-center-wrapper">
        <nav class="nav-left">
            <a href="#">дедлайны</a>
            <span class="star-separator">✦</span>
            <a href="#">активность</a>
        </nav>

        <div class="logo-container">
            <img src="img/gerb.png" alt="герб" class="logo">
        </div>
        
        <nav class="nav-right">            
            <a href="#">расписание будущих постов</a>
        </nav>

        <!-- Закладка лежит здесь, на одном уровне с меню и гербом -->
        <div class="header-bookmark">
    <svg viewBox="0 0 1010 410" preserveAspectRatio="none" xmlns="http://w3.org">
        <defs>
            <!-- 1. Вертикальный градиент заливки (остается без изменений) -->
            <linearGradient id="header-global-fill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="400">
                <stop offset="0%" stop-color="#02304b" />
                <stop offset="40%" stop-color="#012d47" />
                <stop offset="75%" stop-color="#012a42" />
                <stop offset="100%" stop-color="#00263b" />
            </linearGradient>

            <!-- 2. ИСПРАВЛЕНО: Градиент обводки с тегами анимации внутри -->
            <!-- Изначально смещаем координаты x1 и x2 далеко влево (-100% и 0%) -->
            <linearGradient id="header-global-stroke" gradientUnits="userSpaceOnUse" x1="-1010" y1="0" x2="0" y2="410">
                <stop offset="0%" stop-color="#E3CFAC" stop-opacity="0.6" />
                <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" /> <!-- Сам белый блик -->
                <stop offset="100%" stop-color="#E3CFAC" stop-opacity="0.6" />
                
                <!-- Анимация для координаты x1 (движение слева направо) -->
                <animate id="stroke-anim-1" 
                         attributeName="x1" 
                         from="-1010" to="1010" 
                         dur="0.8s" 
                         begin="indefinite" 
                         fill="freeze" />
                         
                <!-- Анимация для координаты x2 (движение слева направо параллельно x1) -->
                <animate id="stroke-anim-2" 
                         attributeName="x2" 
                         from="0" to="2020" 
                         dur="0.8s" 
                         begin="indefinite" 
                         fill="freeze" />
            </linearGradient>
        </defs>

        <polygon points="5,5 1005,5 1005,305 505,405 5,305" 
                 fill="url(#header-global-fill)" 
                 stroke="url(#header-global-stroke)" 
                 stroke-width="5" 
                 vector-effect="non-scaling-stroke" />
    </svg>
</div>
    </div>
</header>

    <script>
        const star = document.querySelector('.star-separator');
        star.addEventListener('mouseenter', () => {
            star.classList.add('is-spinning');
        });
        star.addEventListener('animationend', () => {
            star.classList.remove('is-spinning');
        });


        // Находим элементы для обычных CSS-бликов (буквы, герб)
        const glareElements = document.querySelectorAll('header a, .logo-container');
        
        // НАХОДИМ НАШИ SVG АНИМАЦИИ ОБВОДКИ
        const strokeAnim1 = document.getElementById('stroke-anim-1');
        const strokeAnim2 = document.getElementById('stroke-anim-2');
        
        // Находим общий контейнер шапки для отслеживания наведения
        const headerWrapper = document.querySelector('.header-center-wrapper');

        // 1. Старая логика для букв и герба при наведении на них лично
        glareElements.forEach(element => {
            element.addEventListener('mouseenter', () => {
            element.classList.add('is-glaring');
            });
            element.addEventListener('animationend', () => {
            element.classList.remove('is-glaring');
            });
        });

        // 2. НОВАЯ ЛОГИКА: При наведении на ЛЮБУЮ часть шапки — запускаем неудержимый блик по обводке!
        headerWrapper.addEventListener('mouseenter', () => {
            if (strokeAnim1 && strokeAnim2) {
            strokeAnim1.beginElement();
            strokeAnim2.beginElement();
            }
        });
    </script>


     <script src="https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2.2.1/dist/index.umd.js"></script>
  <script>
    const APP_ID = 54775225;
    const VK_API_VERSION = "5.103";
    let group_id;

    const elSelect = document.getElementById('el-select');
    const inGroup = document.getElementById('in-group');
    elSelect.style.display = "none";
    inGroup.addEventListener('input', e => {
      group_id = +inGroup.value;
      console.log("Selected", group_id);
    });

    const output = document.getElementById('el-output');
    output.style.display = "none";

    const bridge = vkBridge.default;

    bridge.subscribe((e) => console.log("vkBridge event", e));
    bridge.send("VKWebAppInit", {});

    const renderOptions = (groups) => {
      groups.forEach(group => {
        const opt = document.createElement('option');
        opt.innerText = group.name;
        opt.value = group.id;
        inGroup.appendChild(opt);
      });
      elSelect.style.display = "block";
    };

    document.getElementById('btn-get-groups').addEventListener('click', () => {
      bridge.send("VKWebAppGetAuthToken", {"app_id": APP_ID, "scope": "groups"})
      .then(result => {
        console.log("token?", result);
        const token = result.access_token;
        return bridge.send("VKWebAppCallAPIMethod", {
          "method"    : "groups.get",
          "request_id": "32test",
          "params"    : {
            "filter"      : "admin",
            "extended"    : 1,
            "v"           : VK_API_VERSION,
            "access_token": token
          },
        });
      })
      .then(result => {
        console.log("Result from groups.get: %O", result);
        if (result.response && result.response.items) {
          renderOptions(result.response.items);
        } else {
          console.error("No groups?");
        }
      })
      .catch(err => console.error(err));
    });

    document.getElementById('btn-get-token').addEventListener('click', () => {
      if (!group_id) {
        console.log("Group not selected");
        return;
      }

      console.log("Will request permissions for", typeof group_id, group_id);

      bridge.send("VKWebAppGetCommunityToken", {
        "app_id"   : APP_ID,
        "group_id" : group_id,
        "scope"    : "app_widget"
      })
      .then(response => {
        console.log(response);
        if (response.access_token) {
          output.style.display = "block";
          output.innerHTML = `Токен для управления виджетом:<br><small>${response.access_token}</small>`;
        }
      })
      ;
    });

      document.getElementById('addWidgetBtn').addEventListener('click', () => {
      // Вызываем метод VK Bridge для отображения окна установки виджета
      bridge.send("VKWebAppAddToCommunity")
      .then(data => {
        // Выполняется, если пользователь успешно нажал кнопку "Установить виджет" в окне VK
        console.log("Виджет успешно добавлен!", data);
        alert("Виджет успешно добавлен в ваше сообщество!");
      })
      .catch(error => {
        // Выполняется, если произошла ошибка или пользователь закрыл окно
        console.error("Ошибка при установке виджета:", error);
        alert("Не удалось добавить виджет. Проверьте, являетесь ли вы администратором сообщества.");
    });
      });

    
  </script>
</body>
</html>
