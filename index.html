<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROYAL CROSSBREED UNIVERSITY</title>
    <!-- Основной шрифт текста -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/deadlines.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/intro.css">
    <link rel="stylesheet" href="css/sections.css">
    <script>
        // Заставка «конверт» при загрузке (css/intro.css). Ставим класс сразу,
        // до отрисовки страницы, чтобы блок не мелькнул на своём месте раньше времени.
        (function () {
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            var html = document.documentElement;
            html.classList.add('intro');
            setTimeout(function () { html.classList.remove('intro'); }, 2900);
        })();
    </script>
</head>

<body>
    <div class="bg-stripes-container"></div>

    <!-- ИСПРАВЛЕНО: Теперь header — это изолированная и правильная структура -->
    <header>
        <div class="header-center-wrapper">
            <nav class="nav-left">
                <a href="#deadlines">дедлайны</a>
                <span class="star-separator">✦</span>
                <a href="#activity">активность</a>
            </nav>

            <div class="logo-container">
                <img src="img/gerb.png" alt="logo" class="logo">
            </div>

            <nav class="nav-right">
                <a href="#schedule">расписание будущих постов</a>
            </nav>

            <!-- Закладка лежит здесь, на одном уровне с меню и гербом -->
            <!-- Кончик шапки в разделах: наведение или нажатие показывает шапку (css/sections.css) -->
            <button class="header-tip" type="button" aria-label="Показать меню"><span class="header-tip-chevron"></span></button>

            <div class="header-bookmark">
                <svg viewBox="0 0 1010 410" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- градиенты на обводке -->
                        <linearGradient id="header-global-fill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0"
                            y2="400">
                            <stop offset="0%" stop-color="#02304b" />
                            <stop offset="40%" stop-color="#012d47" />
                            <stop offset="75%" stop-color="#012a42" />
                            <stop offset="100%" stop-color="#00263b" />
                        </linearGradient>

                        <radialGradient id="header-global-stroke" gradientUnits="userSpaceOnUse"
                            cx="-9999" cy="-9999" r="400">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" /> <!-- Яркое ядро под мышкой -->
                            <stop offset="50%" stop-color="#B6AF98" />
                            <stop offset="100%" stop-color="#888F85" />
                        </radialGradient>
                    </defs>

                    <!-- Чистое тело шапки -->
                    <polygon points="0,0 1010,0 1010,305 505,405 0,305" fill="url(#header-global-fill)" stroke="none" />

                    <!-- Нижняя обводка 7 пикселей, которая теперь светится СТРОГО под курсором -->
                    <polyline points="0,305 505,405 1010,305" fill="none" stroke="url(#header-global-stroke)"
                        stroke-width="7" stroke-linecap="round" vector-effect="non-scaling-stroke" />
                    <!-- Тонкая вторая полоска внутри шапки, параллельно нижней обводке -->
                    <polyline class="header-inner-line" points="0,293 505,393 1010,293" fill="none" stroke="url(#header-global-stroke)"
                        stroke-width="1.5" vector-effect="non-scaling-stroke" />
                </svg>
            </div>
        </div> 
    </header> 

    <!-- Основной контентный блок сайта -->
    <main class="main-content-block">
        <!-- Золотая лента с названием раздела (заполняет js/router.js, стили — css/pages.css) -->
        <div class="page-ribbon is-hidden" aria-hidden="true"><span class="page-ribbon-text"></span></div>
        <div class="main-inner-content">
            <div class="main-scroll-text">
                <div class="main-scroll-viewport">
                    <div id="view" class="page-view"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Содержимое главной страницы (подставляется роутером) -->
    <template id="home-template">
        <!-- Здесь можно добавить вступительный текст: <p class="home-lead">…</p> -->
        <div class="home-dash"></div>
    </template>

    <script src="js/site.js"></script>

    <!-- Интеграция VK Bridge -->
    <!-- Версия закреплена, а integrity не даст выполниться файлу, если его кто-то подменит.
         Чтобы обновить vk-bridge: поменять версию в адресе и пересчитать integrity
         (например, на https://www.srihash.org/). -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge@3.0.2/dist/browser.min.js"
        integrity="sha384-8K7KdNdtyf4bfQKPtkFUE/XpmZs7mvXeU35WT+sO8mWa2ThX7Cz4y4kzyAVcp2B2"
        crossorigin="anonymous"></script>
    <script>
        if (window.vkBridge) vkBridge.send('VKWebAppInit');
    </script>

    <!-- Страницы с таблицами и переключение между ними без перезагрузки -->
    <script src="js/core.js"></script>
    <script src="js/pages/deadlines.js"></script>
    <script src="js/pages/activity.js"></script>
    <script src="js/pages/schedule.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/tags.js"></script>
    <script src="js/router.js"></script>
</body>

</html>
